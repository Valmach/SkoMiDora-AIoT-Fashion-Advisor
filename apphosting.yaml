# Firebase App Hosting configuration
# This configures your backend service running on Cloud Run.

runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# -------------------------------------------------------
# Secrets from Google Cloud Secret Manager (CRITICAL FIX)
# -------------------------------------------------------
# These must match the secret names you created in Secret Manager.
secrets:
   # Firebase Admin SDK Credentials
   - variable: FIREBASE_ADMIN_PRIVATE_KEY
     secret: FIREBASE_ADMIN_PRIVATE_KEY
     availability:
       - RUNTIME
   - variable: FIREBASE_ADMIN_CLIENT_EMAIL
     secret: FIREBASE_ADMIN_CLIENT_EMAIL
     availability:
       - RUNTIME
   # External API Keys
   - variable: GEMINI_API_KEY
     secret: GEMINI_API_KEY
     availability:
       - RUNTIME
   - variable: GOOGLE_API_KEY
     secret: GOOGLE_API_KEY
     availability:
       - RUNTIME
   - variable: ACCUWEATHER_API_KEY
     secret: ACCUWEATHER_API_KEY
     availability:
       - RUNTIME
