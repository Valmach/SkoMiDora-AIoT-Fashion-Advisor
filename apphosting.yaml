# Firebase App Hosting configuration
# This configures your backend service running on Cloud Run.

runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# -------------------------------------------------------
# Public Environment Variables (Fixes "Firebase is not available")
# -------------------------------------------------------
env:
   - variable: NEXT_PUBLIC_FIREBASE_API_KEY
     value: AIzaSyB6TKlJLqnIzJltKM1jHmugZFhoSu-RpCI
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
     value: styleai-footwear.firebaseapp.com
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
     value: https://styleai-footwear-default-rtdb.firebaseio.com
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
     value: styleai-footwear
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
     value: styleai-footwear.appspot.com
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
     value: '855662411333'
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_FIREBASE_APP_ID
     value: 1:855662411333:web:568ed8c5925da1bc50ed2c
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_ACCUWEATHER_API_BASE_URL
     value: https://dataservice.accuweather.com
     availability:
       - BUILD
       - RUNTIME

# -------------------------------------------------------
# Secrets from Google Cloud Secret Manager (Server-side Keys)
# -------------------------------------------------------
secrets:
   # Firebase Admin SDK Credentials
   - variable: FIREBASE_ADMIN_PRIVATE_KEY
     secret: FIREBASE_ADMIN_PRIVATE_KEY
     availability:
       - BUILD
       - RUNTIME
   - variable: FIREBASE_ADMIN_CLIENT_EMAIL
     secret: FIREBASE_ADMIN_CLIENT_EMAIL
     availability:
       - BUILD
       - RUNTIME
   # External API Keys
   - variable: GEMINI_API_KEY
     secret: GEMINI_API_KEY
     availability:
       - BUILD
       - RUNTIME
   - variable: GOOGLE_API_KEY
     secret: GOOGLE_API_KEY
     availability:
       - BUILD
       - RUNTIME
   - variable: ACCUWEATHER_API_KEY
     secret: ACCUWEATHER_API_KEY
     availability:
       - BUILD
       - RUNTIME
