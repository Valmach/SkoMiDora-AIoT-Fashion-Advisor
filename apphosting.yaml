runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

build:
  command: npm run build
start:
  command: npm start

headers:
  - path: "/*"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"

rewrites:
  - source: "/*"
    destination: "/__next/__request_handler"