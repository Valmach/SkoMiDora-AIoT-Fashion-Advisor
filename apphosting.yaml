# Firebase App Hosting configuration
# This configures your backend service running on Cloud Run.
# Docs: https://firebase.google.com/docs/app-hosting/configure#cloud-run

runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

