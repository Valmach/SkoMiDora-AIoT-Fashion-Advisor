runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

build:
  command: npm run build
start:
  command: npm start

# -------------------------------------------------------
# Public Variables (Safe for the browser, read at build & runtime)
# -------------------------------------------------------
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
# ... (keep the rest of your env and secrets exactly the same)