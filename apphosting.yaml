# Firebase App Hosting configuration
# This configures your backend service running on Cloud Run.

runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Next.js build and start commands
build:
  command: npm run build
start:
  command: npm start

# Redirect all traffic to the Next.js server
headers:
  - path: "/*"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"

rewrites:
  - source: "/*"
    destination: "/__next/__request_handler"

# -------------------------------------------------------
# Environment Variables & Secrets (Everything goes under env!)
# -------------------------------------------------------
env:
   # --- Public Values ---
   - variable: NEXT_PUBLIC_FIREBASE_API_KEY
     value: AIzaSyB6TKlJLqnIzJltKM1jHmugZFhoSu-RpCI
     availability:
       - BUILD
       - RUNTIME
   - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
     value: styleai-footwear.firebaseapp.com
     availability:
       - BUILD
       - RUNTIME
