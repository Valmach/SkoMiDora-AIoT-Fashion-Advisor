runConfig:
  runtime: nodejs20
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 2           # 🔥 Doubled CPU to prevent network stream timeouts
  memoryMiB: 1024  # 🔥 Doubled RAM to stop the Out-Of-Memory container crashes

build:
  command: npm run build
start:
  command: npm start

# ... (keep all your existing env variables below this exactly the same)

# -------------------------------------------------------
# Environment Variables & Secrets (All must be under 'env')
# -------------------------------------------------------
# apphosting.yaml
e# apphosting.yaml
yamlVersion: v1beta

# Secrets must be explicitly declared in their own block
secrets:
  - variable: GEMINI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY
  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY
